<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production ABR Video Player Engine</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            width: 90%;
            max-width: 800px;
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        .controls-panel {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .status-badge {
            font-size: 14px;
            color: #10b981;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>

    <div class="player-container">
        <h2>🎥 Live Stream Sandbox</h2>

        <video id="video-canvas" controls autoplay muted></video>

        <div class="controls-panel">
            <div>
                <label for="quality-selector">⚙️ Video Quality: </label>
                <select id="quality-selector">
                    <option value="-1">Auto (Adaptive Bitrate)</option>
                </select>
            </div>
            <div class="status-badge" id="engine-status">Initializing MSE Engine...</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-canvas');
        const qualitySelector = document.getElementById('quality-selector');
        const statusStatus = document.getElementById('engine-status');

        // Specify the target Video ID to fetch
        const videoId = "vid_1784042725364";
        const streamUrl = `http://localhost:8000/api/v1/stream/${videoId}/master.m3u8`;

        if (Hls.isSupported()) {
            console.log("[Player-Engine] Launching clean Production Tokenized Stream Matrix...");

            // No custom xhrSetup required! The manifest contains direct verified routes.
            const hls = new Hls({
                enableWorker: true
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                statusStatus.innerText = "⚡ Stream Active: Manifest Tokenization engaged";
                data.levels.forEach((level, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = `${level.height}p (${Math.round(level.bitrate / 1000)} kbps)`;
                    qualitySelector.appendChild(option);
                });
            });

            qualitySelector.addEventListener('change', (event) => {
                hls.currentLevel = parseInt(event.target.value);
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error("[Player-Engine-Crash] Stream breakdown:", data);
                    statusStatus.innerText = "❌ Fatal Pipeline Choke";
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
        }
    </script>
</body>

</html>
