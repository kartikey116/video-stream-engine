server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes hit this instead of /, which would otherwise log a
    # request line for every readiness check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the old bundle
    # after a deploy and requests asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: all routes resolve to index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
